name: Puzzle regression tests
on:
  push:
    branches:
      - main
      - fix/hannah-cipher-stable-assignment
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run puzzle regression tests
        run: node --test tests/puzzles.test.cjs
      - name: Check Python syntax
        run: python -m py_compile server.py
